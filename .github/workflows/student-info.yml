name: Student Information Pipeline

on:
  push:
    branches:
      - main

jobs:
  student-information:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Pipeline Started
        run: echo "Student Information Pipeline Started"

      - name: Display Student Information
        run: cat student.txt

      - name: Display Pipeline Completed
        run: echo "Pipeline Execution Completed"
